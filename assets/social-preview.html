<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;background:#16202c;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
.bar{display:flex;height:10px}.bar div{flex:1}
.wrap{padding:86px 96px 0}
.eyebrow{color:#8da2b8;font-weight:700;font-size:25px;letter-spacing:1.5px}
h1{color:#fff;font-size:76px;margin:14px 0 18px;font-weight:800;letter-spacing:-1px}
.sub{color:#c9d6e3;font-size:31px}
.chips{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}
.chip{border:1px solid #33465a;background:#1d2a38;color:#e8eef4;border-radius:24px;padding:9px 20px 9px 16px;font-size:24px;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%}
.foot{position:absolute;bottom:64px;left:96px;right:96px;display:flex;justify-content:space-between;font-size:24px}
.url{color:#fff;font-weight:700}.osh{color:#8da2b8}
</style></head><body>
<div class="bar"><div style="background:#2ea043"></div><div style="background:#e8862a"></div><div style="background:#9aa5b1"></div><div style="background:#d73a49"></div><div style="background:#8b1e2b"></div></div>
<div class="wrap">
<div class="eyebrow">FREE AND OPEN SOURCE FOR MICROSOFT 365</div>
<h1>M365 Script Checker</h1>
<div class="sub">Know what a PowerShell script does to your tenant before you run it</div>
<div class="chips">
<div class="chip"><span class="dot" style="background:#2ea043"></span>Read-only</div>
<div class="chip"><span class="dot" style="background:#e8862a"></span>Changes</div>
<div class="chip"><span class="dot" style="background:#9aa5b1"></span>Cannot tell</div>
<div class="chip"><span class="dot" style="background:#d73a49"></span>Destructive</div>
<div class="chip"><span class="dot" style="background:#8b1e2b"></span>Suspicious</div>
</div></div>
<div class="foot"><span class="url">github.com/PaulOgier/m365-script-checker</span><span class="osh">Outsource House (OSH.co.za)</span></div>
</body></html>
